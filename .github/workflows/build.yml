name: Build Android
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multimental-build-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: '4.7.2'
  GODOT_STATUS: stable
  GODOT_BIN: /home/runner/.local/share/multimental/godot/4.7.2-stable/godot
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
jobs:
  build:
    name: Verify and export APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Pinned Godot and templates
        run: bash scripts/setup-godot.sh
      - name: Configure Android
        run: bash scripts/configure-android-ci.sh
      - name: Stamp metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.0-alpha.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          node tools/stamp-build.mjs "$VERSION" "${GITHUB_SHA:0:7}" "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" "$CODE"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_CODE=$CODE" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skill validation and real tests
        run: |
          node skills/game-production/scripts/gameprod.mjs validate
          node skills/game-production/scripts/gameprod.mjs run verify
          node skills/game-production/scripts/gameprod.mjs gate verified
      - name: Build through production skill
        run: |
          node skills/game-production/scripts/gameprod.mjs run build:android
          node skills/game-production/scripts/gameprod.mjs gate android-built
      - name: Package exact artifact
        run: node tools/package-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: multimental-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-evidence
          path: .gameprod/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  prerelease:
    name: Publish development prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'neurofoxpro/multimental'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multimental-android
          path: artifacts
      - name: Publish verified dev build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          gh release create "v$VERSION" ./*.apk SHA256SUMS.txt build-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Multimental $VERSION" --notes "Playable offline prototype, provisional rules. Source $GITHUB_SHA. Verified skill/core tests and APK export. Device station re-signs with its persistent local private development identity before installation; both hashes are recorded. No store, crafting, network or stable-release claims."
