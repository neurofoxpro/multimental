name: Build Android
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multimental-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: '4.7.2'
  GODOT_STATUS: stable
  GODOT_BIN: /home/runner/.local/share/multimental/godot/4.7.2-stable/godot
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
jobs:
  production:
    name: Production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      apk: ${{ steps.plan.outputs.apk }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install locked development tools
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Select necessary stages
        id: plan
        run: node tools/ci-plan.mjs
      - name: Metadata and publication policy
        run: |
          node skills/game-production/scripts/gameprod.mjs validate
          node tools/security-lint.mjs
          node scripts/changelog.mjs check
          node scripts/changelog.mjs policy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.plan.outputs.apk == 'true'
        with:
          path: |
            ~/.local/share/multimental/godot/4.7.2-stable
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-linux-4.7.2-android-web-v2-${{ hashFiles('scripts/setup-godot.sh') }}
      - name: Pinned Godot and templates
        if: steps.plan.outputs.apk == 'true'
        run: bash scripts/setup-godot.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.plan.outputs.apk == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Android tools
        if: steps.plan.outputs.apk == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
          bash scripts/configure-android-ci.sh
      - name: Stamp metadata
        id: meta
        if: steps.plan.outputs.apk == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('-')[0]")
          VERSION="$BASE_VERSION-alpha.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          CODE=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          node tools/stamp-build.mjs "$VERSION" "$(git rev-parse --short HEAD)" "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" "$CODE"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_CODE=$CODE" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify through production skill
        if: steps.plan.outputs.apk == 'true'
        run: |
          node skills/game-production/scripts/gameprod.mjs run verify
          node skills/game-production/scripts/gameprod.mjs gate verified
      - name: Build tested universal Android APK
        if: steps.plan.outputs.apk == 'true'
        run: |
          node skills/game-production/scripts/gameprod.mjs run build:android
          node skills/game-production/scripts/gameprod.mjs gate android-built
          node tools/package-build.mjs
      - name: Generate Russian release notes
        if: steps.plan.outputs.apk == 'true'
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/changelog.mjs release
          cd artifacts
          sha256sum RELEASE_NOTES.ru.md >> SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.apk == 'true'
        with:
          name: multimental-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.plan.outputs.apk == 'true'
        with:
          name: production-evidence
          path: .gameprod/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  source-seal:
    name: Source seal ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
    needs: production
    if: github.event_name == 'pull_request' && needs.production.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node tools/ci-identity.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-source-identity
          path: .gameprod/evidence/ci-source.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  prerelease:
    name: Publish development prerelease
    needs: production
    if: needs.production.outputs.apk == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'neurofoxpro/multimental'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: multimental-android
          path: artifacts
      - name: Publish verified dev build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.production.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          gh release create "v$VERSION" ./*.apk SHA256SUMS.txt build-manifest.json RELEASE_NOTES.ru.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Multimental $VERSION" --notes-file RELEASE_NOTES.ru.md
  release-memory:
    name: Record published release in Issues
    needs: prerelease
    if: needs.prerelease.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'neurofoxpro/multimental'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: multimental-android
          path: artifacts
      - name: Record actual release and asset identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/record-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-memory-evidence
          path: .gameprod/evidence/release-record.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
