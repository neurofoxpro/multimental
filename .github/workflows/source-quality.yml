name: Cross-platform source quality
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: source-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: node tools/source-tests.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-evidence-${{ matrix.os }}
          path: |
            .gameprod/evidence/source-tests.json
            .gameprod/evidence/source-tests.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
